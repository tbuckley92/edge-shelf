<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge Shelf · Finish preview</title><link rel="stylesheet" href="shelf.css"><link rel="stylesheet" href="collection.css"><style>body{background:#eee}main{padding-top:20px}.preview-heading{padding:0 24px}.preview-heading h1{font:28px Georgia;margin:0 0 8px}.preview-heading p{font:13px/1.5 system-ui}.preview-heading button{padding:8px 12px;border:1px solid #aaa;background:white;margin-right:8px;cursor:pointer}.finish-name{position:absolute;top:8px;left:8px;color:#fff9;font:11px system-ui}.wall.cabinet{--backwall:linear-gradient(100deg,#222827,#39413e 50%,#252c29);padding-bottom:100px}.wall .piece{cursor:default}</style><main><div class="preview-heading"><h1>Layered shelves</h1><p>Ice and volcanic ridges sit in front of the pieces. Shelves are 30% shallower, with shorter icicles and no lava.</p><button data-width="680">Desktop</button><button data-width="375">Mobile</button></div><div class="wall cabinet"></div></main><script src="materials.js"></script><script>
const wall=document.querySelector('.wall');
new ResizeObserver(e=>wall.style.setProperty('--cm',e[0].contentRect.width/100+'px')).observe(wall);
for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>document.querySelector('main').style.maxWidth=b.dataset.width+'px';
Promise.all([fetch('catalog.json').then(r=>r.json()),fetch('assets.json').then(r=>r.json())]).then(([catalog,assets])=>{
const pieces=catalog.filter(p=>p.cut&&assets[p.id]&&p.w>0&&p.w<43&&p.h>0).slice(0,12);
['ice','magma','snow','grass','jungle','oak'].forEach((key,n)=>{const m=materials[key],row=document.createElement('section');row.className='row effects-visible';row.dataset.finish=key;row.dataset.fantasy=m.body?'true':'false';row.dataset.foreground=m.foreground?'true':'false';row.style.cssText=`z-index:${6-n};--clearance:48;--shelf-depth:8;--texture:${m.texture};--top:${m.top};--tone:${m.tone};--fantasy-body:${m.body||'none'};--fantasy-fringe:${m.fringe||'none'};--fringe-ratio:${m.fringeRatio||6};--power:.9;--shelf-foreground:${m.foreground||'none'};--foreground-rise:${m.foregroundRise||4};`;
row.innerHTML='<div class="display"><span class="finish-name">'+m.label+'</span><div class="ledge"><span class="top"></span><span class="front"></span><span class="fantasy-body"></span><span class="fantasy-fringe"></span></div><div class="slots"></div><span class="shelf-foreground" aria-hidden="true"></span></div>';
pieces.slice(n*2,n*2+2).forEach((p,i)=>{const slot=document.createElement('div');slot.className='piece';slot.style.cssText=`--x:${i?55:7};--w:35;--h:36`;const image=document.createElement('img');image.src=assets[p.id].src;image.alt=p.name;slot.append(image);row.querySelector('.slots').append(slot)});wall.append(row)});
});</script></html>
