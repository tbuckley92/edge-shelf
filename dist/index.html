<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafaf8"><title>Edge Shelf · My shelves</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shelf.css"><link rel="stylesheet" href="collection.css"></head><body><main><header><img class="edge-logo" src="edge-logo.webp" width="360" height="67" alt="Edge Sculpture"></header><section id="loginPanel"><a class="edge-button" href="/api/auth/login">Sign in with Shopify</a><p>Keep your collection with you on every device.</p></section>
<nav id="collectionTools" hidden><button id="addPiece" class="edge-button">Master Shelf · Add a piece</button><button id="signOut">Sign out</button><details><summary>Preferences</summary><label><input id="marketingPreference" type="checkbox"> I’d like Edge Sculpture news and offers by email (optional).</label></details></nav>
<p id="emptyCollection" hidden>Add your first piece to start your collection.</p><button id="undoRemoval" hidden>Piece removed · Undo</button><button id="retrySave" hidden>Retry save</button><p id="loadStatus" role="status" hidden></p><section class="wall" id="shelves" aria-label="Collector shelves"></section><section class="dimension-pending" id="pending" hidden></section></main>
<dialog class="product-drawer" aria-labelledby="pieceTitle"><button type="button" class="close-menu close-details" aria-label="Close product details">×</button><div class="product-summary"><img class="product-image" alt=""><div><p class="product-brand">Edge Sculpture</p><h2 id="pieceTitle"></h2><p class="dimensions"></p></div></div><a class="product-link" target="_blank" rel="noopener"><span>View product</span></a><button id="removePiece" class="remove-piece">Remove this copy from my collection</button></dialog><dialog id="shelfMenu" class="shelf-menu"><form method="dialog"><button class="close-menu" aria-label="Close shelf settings">×</button></form><h2></h2><label>Finish <select name="finish"></select></label><fieldset class="background-settings"><legend>Background photo</legend><label class="photo-upload">Upload photo<input id="backgroundFile" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="backgroundStatus" role="status">JPG, PNG or WebP · up to 20 MB</p><label>Horizontal position<input name="bgX" type="range" min="0" max="100" step="1"></label><label>Vertical position<input name="bgY" type="range" min="0" max="100" step="1"></label><label>Darken photo<input name="bgDim" type="range" min="0" max="100" step="5"></label><button type="button" id="removeBackground">Remove photo</button></fieldset><label>Weather <select name="weather"><option value="none">None</option><option value="rain">Rain</option><option value="snow">Snow</option></select></label><label>Fog strength <input name="fog" type="range" min="0" max="100" step="5"><output data-output="fog"></output></label><label>Fog speed <input name="fogSpeed" type="range" min="0.25" max="3" step="0.25"><output data-output="fogSpeed"></output></label><label>Fog colour <input name="fogColour" type="color" value="#edf7ff"></label><label>Lighting <select name="fixture"><option value="none">No lights</option><option value="spot">Spotlights</option><option value="strip">LED strip</option></select></label><label>Colour <select name="colour"><option value="warm">Warm white</option><option value="cool">Cool white</option><option value="amber">Amber</option><option value="blue">Ice blue</option><option value="custom">Custom colour</option><option value="rainbow">Rainbow cycle</option><option value="off">Off</option></select></label><label>Light colour <input name="lightColour" type="color" value="#ffe5b3"></label><label>Brightness <input name="brightness" type="range" min="0" max="100" step="5"><output data-output="brightness"></output></label><label class="speed-setting">Cycle time <input name="speed" type="range" min="3" max="60" step="1"><output data-output="speed"></output></label><button type="button" id="saveShelf"><span>Save</span></button><p id="saveStatus" role="status" aria-live="polite"></p></dialog><dialog id="catalogueDrawer" class="product-drawer"><button id="closeCatalogue" class="close-menu" aria-label="Close catalogue">×</button><h2>Master Shelf</h2><p>Explore the collection and add the pieces you own.</p><label>Search pieces<input id="catalogueSearch" type="search" placeholder="Name or animal"></label><label>Order<select id="catalogueSort"><option value="oldest">Release date · oldest first</option><option value="newest">Release date · newest first</option><option value="name">Name A–Z</option></select></label><p id="catalogueNote"></p><div id="catalogueResults"></div></dialog><script src="materials.js"></script><script src="layout.js"></script><script src="wall.js"></script></body></html>
